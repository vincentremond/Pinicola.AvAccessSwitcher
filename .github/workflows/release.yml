name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET 10 is still in preview – adjust the channel when it goes GA
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dotnet tools (paket, fantomas)
        run: dotnet tool restore

      - name: Restore paket packages
        run: dotnet paket restore

      - name: Publish self-contained single-file EXE
        run: |
          dotnet publish Pinicola.AvAccessSwitcher/Pinicola.AvAccessSwitcher.fsproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish/

      - name: Determine version tag
        id: version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "v-$sha"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version tag: $tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated release from commit ${{ github.sha }}.

            **Commit message:** ${{ github.event.head_commit.message }}
          files: publish/Pinicola.AvAccessSwitcher.exe
          draft: false
          prerelease: false
