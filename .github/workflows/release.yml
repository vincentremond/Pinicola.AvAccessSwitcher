name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 is still in preview – adjust the channel when it goes GA
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dotnet tools (paket, fantomas, gitversion)
        run: dotnet tool restore

      - name: Restore paket packages
        run: dotnet paket restore

      - name: Determine GitVersion
        id: version
        shell: pwsh
        run: |
          $gv = dotnet dotnet-gitversion | ConvertFrom-Json
          $semver = $gv.SemVer
          $informational = $gv.InformationalVersion
          $tag = "v$semver"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "informational=$informational" >> $env:GITHUB_OUTPUT
          Write-Host "Computed GitVersion: $informational (Tag: $tag)"

      - name: Publish self-contained single-file EXE
        run: |
          dotnet publish Pinicola.AvAccessSwitcher/Pinicola.AvAccessSwitcher.fsproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated release `${{ steps.version.outputs.informational }}` from commit ${{ github.sha }}.

            **Commit message:** ${{ github.event.head_commit.message }}
          files: publish/Pinicola.AvAccessSwitcher.exe
          draft: false
          prerelease: false
